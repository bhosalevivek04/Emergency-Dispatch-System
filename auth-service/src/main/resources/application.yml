server:
  port: 8086

spring:
  application:
    name: auth-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emergency_dispatch}
    username: ${SPRING_DATASOURCE_USERNAME:dispatch_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dispatch_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Enable scheduling for token cleanup
  task:
    scheduling:
      enabled: true

# JWT Configuration (RS256 with RSA keys)
jwt:
  expiration: 900000 # 15 minutes in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  # Private key: auth-service/src/main/resources/keys/private_key_pkcs8.pem
  # Public key: auth-service/src/main/resources/keys/public_key.pem

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,ping,diskSpace
        liveness:
          include: livenessState,ping
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

ambulance:
  service:
    url: ${AMBULANCE_SERVICE_URL:http://localhost:8082}

# Logging
logging:
  level:
    com.vivek.auth: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"

startup:
  dependency-check:
    enabled: ${STARTUP_DEPENDENCY_CHECK_ENABLED:true}
    timeout-seconds: ${STARTUP_DEPENDENCY_CHECK_TIMEOUT_SECONDS:5}
