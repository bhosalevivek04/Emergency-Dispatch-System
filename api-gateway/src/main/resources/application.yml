server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth Service Routes (PUBLIC - no JWT required)
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth(?<segment>/?.*), /auth${segment}

        # Emergency Service Routes
        - id: emergency-service
          uri: ${EMERGENCY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/emergencies,/api/emergencies/**
          filters:
            - RewritePath=/api/emergencies(?<segment>/?.*), /emergency${segment}

        # Ambulance Service Routes
        - id: ambulance-service
          uri: ${AMBULANCE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/ambulances,/api/ambulances/**
          filters:
            - RewritePath=/api/ambulances(?<segment>/?.*), /ambulance${segment}

        # Tracking Service Routes
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/tracking,/api/tracking/**
          filters:
            - RewritePath=/api/tracking(?<segment>/?.*), /api/tracking${segment}

        # WebSocket Route for Tracking Service
        - id: tracking-websocket
          uri: ${TRACKING_SERVICE_URL:ws://localhost:8085}
          predicates:
            - Path=/ws/**

        # Notification Service Routes
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notifications,/api/notifications/**
          filters:
            - RewritePath=/api/notifications(?<segment>/?.*), /notification${segment}

        # Dispatch Service Routes (if needed)
        - id: dispatch-service
          uri: ${DISPATCH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/dispatch,/api/dispatch/**

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# Auth Service Configuration
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8086}

# Actuator Configuration - Restrict endpoint exposure for security
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
